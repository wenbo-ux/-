<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1170">
<title>我们的相册 · 一起长大的日子</title>
<meta name="description" content="上传和浏览大家的合照：小学2区 / 小学，各自独立访问密钥。">
<link rel="stylesheet" href="assets/style.css?v=14">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">✦</div>
    <div>
      <h1>我们的相册</h1>
      <p class="sub">一起长大的日子</p>
    </div>
  </div>
  <button id="lockBtn" class="ghost" hidden>锁定</button>
</header>

<nav class="tabs" id="tabs" role="tablist">
  <button class="tab active" data-area="grade7" role="tab">小学2区<span class="dot"></span></button>
  <button class="tab" data-area="primary" role="tab">小学<span class="dot"></span></button>
</nav>

<main>
  <!-- 未解锁 -->
  <section id="lockView" class="card lock-card" hidden>
    <div class="lock-ico">🔐</div>
    <h2 id="lockTitle">小学2区</h2>
    <p class="hint" id="lockHint">这里需要访问密钥才能进入</p>
    <form id="keyForm" autocomplete="off">
      <input id="keyInput" type="password" inputmode="text" placeholder="输入访问密钥" autocomplete="current-password" required>
      <button type="submit" class="primary" id="keyBtn">解锁</button>
    </form>
  </section>

  <!-- 已解锁 -->
  <section id="areaView" hidden>
    <div class="card upload-card">
      <div class="seg mode" id="modeSeg">
        <button type="button" data-mode="photo" class="on">照片</button>
        <button type="button" data-mode="text">文字</button>
      </div>

      <div class="field">
        <label for="nameInput">你的名字</label>
        <input id="nameInput" type="text" maxlength="16" placeholder="例如：小雅" autocomplete="nickname">
      </div>

      <div id="photoPane">
        <div class="field" id="captionField">
          <label for="captionInput">写一句话 <span class="opt">（可选）</span></label>
          <input id="captionInput" type="text" maxlength="60" placeholder="那天我们笑得好开心">
        </div>

        <button id="pickBtn" class="drop" type="button">
          <div class="drop-inner">
            <span class="drop-ico">＋</span>
            <strong>选择 / 拖入合照</strong>
            <small>支持多张，自动压缩，单张 ≤ 20MB</small>
          </div>
        </button>
        <div id="queue" class="queue"></div>
        <div id="progress" class="progress" hidden><i></i></div>
        <button id="uploadBtn" class="primary wide" hidden>上传</button>
      </div>

      <div id="textPane" hidden>
        <textarea id="textInput" maxlength="500" rows="4" placeholder="想说的话、那天的事、想对大家说的……"></textarea>
        <div class="counter"><span id="textCount">0</span>/500</div>
        <button id="postTextBtn" class="primary wide">发布</button>
      </div>
    </div>

    <div class="gallery-head">
      <h2>合照墙</h2>
      <span id="count" class="count"></span>
    </div>
    <div id="gallery" class="gallery"></div>
    <div id="empty" class="empty" hidden>
      <span>🖼️</span>
      <p>还没有照片，来传第一张吧</p>
    </div>
    <div id="skeletons" class="gallery" hidden></div>
  </section>
</main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="关闭">✕</button>
  <img id="lbImg" alt="">
  <div class="lb-meta"><span id="lbAuthor"></span><span id="lbTime"></span></div>
  <button class="lb-del" id="lbDel">删除这张</button>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h3 id="sheetTitle">回复</h3>
      <button id="sheetClose" type="button" aria-label="关闭">✕</button>
    </div>
    <div id="sheetList" class="sheet-list"></div>
    <form id="sheetForm" class="sheet-form" autocomplete="off">
      <input id="sheetInput" type="text" maxlength="200" placeholder="写一条回复…" required>
      <button type="submit" class="primary">发送</button>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<input id="fileInput" type="file" accept="image/*" multiple hidden>

<script src="assets/config.js?v=14"></script>
<script src="assets/app.js?v=14"></script>
</body>
</html>
